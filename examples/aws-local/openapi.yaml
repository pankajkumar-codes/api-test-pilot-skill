openapi: 3.0.3
info:
  title: Local gateway example
  version: "1.0.0"
servers:
  - url: http://127.0.0.1:8081/prod
security:
  - apiKey: []
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string, maxLength: 100}
        tag: {type: string, nullable: true}
        owner: {type: string}
    NewPet:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        tag: {type: string}
    Message:
      type: object
      properties:
        message: {type: string}
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
  /pets:
    get:
      operationId: listPets
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Pet'}
        "403": {description: forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/NewPet'}
      responses:
        "201":
          description: created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        "400": {description: invalid, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        "403": {description: forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
  /pets/{petId}:
    parameters:
      - {name: petId, in: path, required: true, schema: {type: string}}
    get:
      operationId: getPet
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Pet'}
        "403": {description: forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        "404": {description: not found, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
    delete:
      operationId: deletePet
      responses:
        "204": {description: deleted}
        "403": {description: forbidden, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
        "404": {description: not found, content: {application/json: {schema: {$ref: '#/components/schemas/Message'}}}}
