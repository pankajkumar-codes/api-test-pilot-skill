"""Mock schema used to validate the GraphQL generators."""
schema { query: Query mutation: Mutation }

directive @auth(requires: String = "USER") on FIELD_DEFINITION
directive @constraint(minLength: Int, maxLength: Int, min: Int, max: Int, format: String) on INPUT_FIELD_DEFINITION | ARGUMENT_DEFINITION

type Query {
  "Fetch one pet"
  pet(id: ID!): Pet
  pets(first: Int @constraint(min: 0), after: String, search: String): [Pet!]!
  me: User
  health: String
}

type Mutation {
  createPet(input: NewPetInput!): Pet!
  updatePet(id: ID!, input: UpdatePetInput!): Pet
  deletePet(id: ID!): Boolean!
}

type Pet {
  id: ID!
  name: String!
  tag: String
  species: Species
  owner: User
  friends: [Pet!]
}

type User {
  id: ID!
  name: String!
  email: String
  passwordHash: String
}

enum Species { DOG CAT BIRD }

input UpdatePetInput {
  name: String
  tag: String
  species: Species
}

input NewPetInput {
  name: String! @constraint(minLength: 1, maxLength: 50)
  tag: String @constraint(maxLength: 20)
  species: Species = DOG
}
